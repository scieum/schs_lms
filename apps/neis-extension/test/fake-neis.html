<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>가짜 나이스 · 교과세부능력특기사항 입력 (시험용)</title>
  <style>
    body { font: 14px/1.5 "Malgun Gothic", sans-serif; margin: 24px; color: #222; }
    h1 { font-size: 18px; }
    table { border-collapse: collapse; width: 100%; max-width: 980px; }
    th, td { border: 1px solid #c8ccd2; padding: 6px 8px; vertical-align: top; }
    th { background: #eef1f5; }
    textarea { width: 100%; height: 64px; font: inherit; }
    .bar { margin: 12px 0; display: flex; gap: 8px; align-items: center; }
    #saved { white-space: pre-wrap; background: #f6f7f9; padding: 10px; max-width: 980px; }
  </style>
</head>
<body>
  <h1>교과세부능력및특기사항 · 물리학 · 2학년 3반 (시험용 화면)</h1>
  <p>실제 나이스가 아니에요. 확장 프로그램이 학생 줄을 찾아 채우는지, 저장 시 값이 반영되는지 확인하는 용도예요.
    아래 입력칸은 <b>input 이벤트로만</b> 내부 값이 바뀌어요 (실제 그리드처럼).</p>
  <table>
    <thead><tr><th>번호</th><th>성명</th><th>세부능력 및 특기사항</th><th>바이트</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="bar"><button id="save" type="button">저장</button><span>← 확장 프로그램은 이 버튼을 누르지 않아요</span></div>
  <div id="saved"></div>
  <script>
    // 가짜 학생 (데모 데이터와 같은 2학년 3반)
    const students = [[1, "강예린"], [7, "박서준"], [12, "김민준"], [20, "이하늘"]];
    const model = {}; // 화면 그리드의 내부 값: input 이벤트가 와야만 바뀐다
    const bytes = (t) => [...t.replace(/\r\n/g, "\n")].reduce((n, c) => n + (c === "\n" ? 2 : c.charCodeAt(0) <= 0x7f ? 1 : 3), 0);
    const tbody = document.getElementById("rows");
    for (const [no, name] of students) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${no}</td><td>${name}</td><td><textarea></textarea></td><td class="b">0</td>`;
      const ta = tr.querySelector("textarea");
      ta.addEventListener("input", () => { model[no] = ta.value; tr.querySelector(".b").textContent = bytes(ta.value); });
      tbody.appendChild(tr);
    }
    document.getElementById("save").addEventListener("click", () => {
      document.getElementById("saved").textContent = "저장된 값\n" + students.map(([no, name]) => `${no} ${name}: ${model[no] ?? "(없음)"}`).join("\n");
    });
  </script>
</body>
</html>
